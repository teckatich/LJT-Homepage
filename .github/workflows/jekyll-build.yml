name: Jekyll build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate content, page scope, and project-site links
        run: |
          python3 - <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          site = Path('_site')
          expected_pages = {'index.html', 'publications/index.html'}
          actual_pages = {str(path.relative_to(site)) for path in site.rglob('*.html')}
          assert actual_pages == expected_pages, f'Unexpected page output: {actual_pages}'

          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          placeholders = [
              'Your Name', 'Your Sidebar Name', 'Red Brick University',
              'none@example.org', 'Short biography for the left-hand sidebar',
              'Academic Pages is a ready-to-fork', 'PS_CX0AAAAAJ',
              'yourorcidurl', 'john+snow', '/images/profile.png',
          ]

          class LinkParser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in ('href', 'src') or not value:
                          continue
                      parsed = urlparse(value)
                      if parsed.netloc and parsed.netloc != 'teckatich.github.io':
                          continue
                      if parsed.path.startswith('/'):
                          assert parsed.path.startswith('/LJT-Homepage/'), f'Incorrect project path: {value}'

          for page in sorted(expected_pages):
              content = (site / page).read_text(encoding='utf-8')
              readable = unescape(content)
              for title in titles:
                  assert readable.count(title) == 1, f'Missing or duplicated publication in {page}: {title}'
              for placeholder in placeholders:
                  assert placeholder not in readable, f'Template placeholder in {page}: {placeholder}'
              assert 'jliugi@connect.ust.hk' in readable, f'Missing email in {page}'
              assert 'https://github.com/Vicent0205' in readable, f'Incorrect GitHub contact in {page}'
              LinkParser().feed(content)

          home = (site / 'index.html').read_text(encoding='utf-8')
          for section in ('education', 'research-experience', 'publications', 'skills-and-research-interests', 'honors', 'contact'):
              assert f'id="{section}"' in home, f'Missing About section: {section}'
          print('Validated: exactly two existing pages, six publications on both, no profile placeholders, and project-site links.')
          PY

      - name: Upload validated site
        uses: actions/upload-artifact@v4
        with:
          name: ljt-homepage-site
          path: _site/
          if-no-files-found: error
          retention-days: 7
